# Was generated from sh1pt's node-pnpm pack; converted to Bun (package manager) in the
# Bun migration. vitest still runs the tests (jsdom suite), under Node on the runner.
name: test

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - run: bun run test:run
        env:
          CI: true
